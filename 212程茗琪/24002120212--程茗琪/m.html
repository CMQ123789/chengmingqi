<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>24002120212</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
body {
    background-color: #ffffff;
    /* 删除 display:flex; justify-content:center; */
    padding: 0;
    margin:0;
    font-family: "Microsoft Yahei", "PingFang SC", sans-serif;
}
.app {
    width: 100%;
    min-height: 100vh;
    background-color: #1c1f26;
    color: #ffffff;
    overflow: hidden;
    padding-bottom: 20px;
}
    /* ========== 顶部 Banner 图片位 ========== */
    .banner {
        width: 100%;
        height: 220px;
        position: relative;
    }
    .banner-img{
        width:100%;
        height:100%;
        object-fit:cover;
    }
    .banner-tip {
        position: absolute;
        top: 12px;
        right: 12px;
        background: #f0e6c8;
        color: #000;
        padding: 5px 10px;
        border-radius: 4px;
        font-size: 13px;
    }
    .sound-btn {
        position: absolute;
        bottom: 14px;
        right: 14px;
        width: 34px;
        height: 34px;
        border-radius: 50%;
        background: rgba(0, 0, 0, 0.45);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-size: 16px;
    }
    /* ========== Tab 栏：文字横向排列 ========== */
    .tab-bar {
        display: flex;
        justify-content: space-around;
        align-items: center;
        height: 54px;
        border-bottom: 1px solid #2a2d36;
        background-color: #1c1f26;
    }
    .tab-item {
        font-size: 20px;
        color: #b8bcc4;
        padding: 0 10px;
        position: relative;
        height: 100%;
        display: flex;
        align-items: center;
    }
    .tab-item.active {
        color: #ffffff;
        font-weight: 600;
    }
    .tab-item.active::after {
        content: "";
        position: absolute;
        left: 50%;
        bottom: 0;
        transform: translateX(-50%);
        width: 46px;
        height: 3px;
        background-color: #ffd040;
        border-radius: 2px;
    }
    /* ========== 列表区域 ========== */
    .list {
        padding: 14px;
        display: flex;
        flex-direction: column;
        gap: 14px;
    }
    .card {
        background-color: #272b33;
        border-radius: 10px;
        padding: 12px;
        display: flex;
        gap: 12px;
        align-items: center;
    }
    .card.gold {
        border: 2px solid #d49c28;
    }
    /* 卡片图片位 */
    .card-img {
        width: 156px;
        height: 116px;
        border-radius: 8px;
        flex-shrink: 0;
        overflow:hidden;
    }
    .card-img img{
        width:100%;
        height:100%;
        object-fit:cover;
    }
    .card-content {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
    }
    .card-title {
        font-size: 17px;
        font-weight: 700;
        color: #ffffff;
        line-height: 1.4;
    }
    .card-sub {
        font-size: 13px;
        color: #9ea3ad;
        margin-top: 6px;
    }
    .tag {
        display: inline-block;
        margin-top: 8px;
        padding: 4px 9px;
        background-color: #234b80;
        color: #ffffff;
        border-radius: 4px;
        font-size: 13px;
    }
    .link {
        margin-top: 10px;
        font-size: 18px;
        color: #ffc436;
        font-weight: 600;
    }
    .btn {
        align-self: flex-start;
        margin-top: 10px;
        padding: 9px 22px;
        background-color: #ffc436;
        color: #111;
        border: none;
        border-radius: 6px;
        font-size: 17px;
        font-weight: 700;
        cursor: pointer;
    }
    /* ========== 底部导航栏 ========== */
    .bottom-nav {
        margin-top: 10px;
        padding: 12px 0 6px;
        background-color: #1c1f26;
        border-top: 1px solid #2a2d36;
        display: flex;
        justify-content: space-around;
    }
    .nav-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        color: #9ea3ad;
        font-size: 13px;
    }
    .nav-item.active {
        color: #ffc436;
    }
    .nav-icon {
        width: 28px;
        height: 28px;
        display:flex;
        align-items:center;
        justify-content:center;
    }
    .bottom-nav .nav-item a {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap:6px;
    color: inherit;
    text-decoration: none; /* 去掉下划线 */
}
</style>
</head>
