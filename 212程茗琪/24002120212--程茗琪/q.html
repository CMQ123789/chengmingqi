<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>程茗琪</title>
<style>
*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
body{
    background-color: #ffffff;
    font-family: "Microsoft Yahei", "PingFang SC", sans-serif;
    overflow-x: hidden;
}
/* 顶部导航栏【手机端，横向不换行】 */
.top-nav{
    display:flex;
    flex-direction:row;
    align-items:center;
    justify-content:flex-start;
    padding:12px 14px;
    gap:18px;
    white-space:nowrap;
}
.top-nav .nav-text{
    font-size:16px;
    color:#666;
}
.top-nav .nav-text.active{
    color:#000;
    font-weight:bold;
    position:relative;
}
.top-nav .nav-text.active::after{
    content:"";
    width:26px;
    height:3px;
    background:#ffb428;
    border-radius:2px;
    position:absolute;
    bottom:-5px;
    left:50%;
    transform:translateX(-50%);
}
.top-right{
    margin-left:auto;
    display:flex;
    gap:16px;
}
.top-right svg{
    width:20px;
    height:20px;
}
/* 主内容容器 底部预留高度，避开底部tab */
.container{
    padding:0 16px;
    padding-bottom:84px;
}
/* 帖子卡片 */
.post-card{
    border-bottom:8px solid #f4f4f4;
    padding:16px 0;
}
.post-header{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:12px;
}
.avatar{
    width:44px;
    height:44px;
    border-radius:50%;
    overflow:hidden;
    flex-shrink:0;
}
.avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}
.post-info h3{
    font-size:17px;
    color:#000;
    display:flex;
    align-items:center;
    gap:4px;
}
.post-info .time{
    font-size:13px;
    color:#777;
    margin-top:3px;
}
.post-desc{
    font-size:17px;
    line-height:1.5;
    color:#111;
    margin-bottom:12px;
}
.post-desc .hash{
    color:#2878d8;
}
/* 帖子图片容器，手机端满宽，图片等比例展示不拉伸 */
.post-img-wrap{
    width:100%;
    border-radius:12px;
    overflow:hidden;
    margin-bottom:14px;
}
.post-img-wrap img{
    width:100%;
    display:block;
    height:auto;
    object-fit:contain;
}
/* 帖子底部操作栏 */
.post-action{
    display:flex;
    justify-content:space-between;
    padding:0 20px;
}
.action-item{
    display:flex;
    align-items:center;
    gap:5px;
    color:#777;
    font-size:15px;
}
.action-item svg{
    width:20px;
    height:20px;
}
/* ==========底部Tab导航【手机端固定底部】========== */
.bottom-tab{
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    height:76px;
    background:#ffffff;
    display:flex;
    justify-content:space-around;
    align-items:center;
    border-top:1px solid #eee;
}
.tab-item{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    color:#777;
    font-size:13px;
}
/* active选中：首页高亮黄色 */
.tab-item.active{
    color:#ffb428;
}
.tab-icon{
    width:26px;
    height:26px;
}
.bottom-tab .tab-item a{
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    color:inherit;
    text-decoration:none; /* 清除下划线 */
}
</style>
</head>
